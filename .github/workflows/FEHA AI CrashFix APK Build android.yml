steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract CrashFix ZIP
    run: |
      unzip -o FEHA_AI_STEP02_CRASHFIX.zip -d project
      find project -name settings.gradle.kts -print

  - name: Locate project
    run: |
      PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
      test -f "$PROJECT_DIR/settings.gradle.kts"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Generate Gradle wrapper
    run: |
      cd "$PROJECT_DIR"
      gradle wrapper --gradle-version 8.9 --distribution-type bin

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew assembleDirectDebug assemblePlayDebug --stacktrace

  - name: Upload APK files
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: FEHA-AI-CrashFix-APKs
      path: project/**/app/build/outputs/apk/**/*.apk
      if-no-files-found: warn
      
